name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check bounded log-reader failures without Open Cloud
        run: python3 -B scripts/test-server-log-reader.py
      - name: Check container bootstrap with synthetic tools
        run: python3 -B scripts/test-docker-bootstrap.py
      - name: Check static Racer parity and release contracts
        run: python3 -B scripts/check-racer-parity.py
